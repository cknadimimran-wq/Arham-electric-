workflows:
  arham_android_apk:
    name: Arham Electric Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Create Android platform files if missing
        script: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.arhamelectric .
          fi
      - name: Get packages
        script: flutter pub get
      - name: Analyze project
        script: flutter analyze
      - name: Build release APK
        script: flutter build apk --release --target=main.dart
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
